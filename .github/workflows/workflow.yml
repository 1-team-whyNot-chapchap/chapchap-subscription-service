# Actions 탭 목록에 표시될 워크플로우명
name: Subscription Build And Push

# 이벤트 트리거 정의
on:
  # main 브랜치에 push가 발생했을 때만 실행
  push:
    branches: [main]

env:
  # ghcr.io에 올릴 이미지명 설정
  IMAGE_NAME: chapchap-subscription-service

# 해당 워크플로우가 실행 중 GITHUB_TOKEN에 부여할 권한 설정
permissions:
  # 해당 레포 코드를 checkout하기 위한 최소 조건
  contents: read
  # ghcr.io(GitHub Packages)에 이미지를 push하기 위한 권한
  packages: write

jobs:
  # job의 id, Actions 로그에 표시
  build-and-push:
    # 해당 job을 실행할 GitHub 호스팅 러너의 OS 이미지
    runs-on: ubuntu-22.04
    steps:
      # 현재 레포 코드를 러너로 내려받는 공식 액션
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to ghcr.io
        # Docker 레지스트리 로그인을 대신 처리해주는 공식 액션
        uses: docker/login-action@v4
        with:
          # 로그인할 대상 레지스트리 주소
          registry: ghcr.io
          # 이 워크플로우를 트리거한 사용자의 GitHub ID
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME
          docker build -t $IMAGE:$GITHUB_RUN_NUMBER .
          docker push $IMAGE:$GITHUB_RUN_NUMBER
