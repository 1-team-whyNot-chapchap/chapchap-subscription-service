spring:
  application:
    name: subscription-service

  profiles:
    active: prod

  config:
    import: optional:file:.env[.properties]

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: ${APP_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health

portone:
  api:
    base-url: ${PORTONE_API_BASE_URL}
    secret: ${PORTONE_API_SECRET}

payment:
  billing-key:
    encryption-key: ${PAYMENT_BILLING_KEY_ENCRYPTION_KEY}

app:
  kafka:
    delivery-order:
      topic: ${KAFKA_TOPIC_SUBSCRIPTION_DELIVERY_ORDER}
      send-timeout: ${KAFKA_DELIVERY_ORDER_SEND_TIMEOUT}
    auth-subscription-status:
      topic: ${KAFKA_TOPIC_SUBSCRIPTION_AUTH_STATUS}
    customer-delivery-address:
      topic: ${KAFKA_TOPIC_CUSTOMER_DELIVERY_ADDRESS}
    customer-payment:
      topic: ${KAFKA_TOPIC_CUSTOMER_PAYMENT}
    customer-refund:
      topic: ${KAFKA_TOPIC_CUSTOMER_REFUND}
    customer-subscription-notification:
      topic: ${KAFKA_TOPIC_CUSTOMER_SUBSCRIPTION_NOTIFICATION}
    delivery-refund:
      topic: ${KAFKA_TOPIC_DELIVERY_REFUND}
      dlt-topic: ${KAFKA_TOPIC_DELIVERY_REFUND_DLT}
      group-id: ${KAFKA_CONSUMER_GROUP_DELIVERY_REFUND}

# Springdoc Openapi
springdoc:
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    enabled: false
  api-docs:
    path: /api-docs
