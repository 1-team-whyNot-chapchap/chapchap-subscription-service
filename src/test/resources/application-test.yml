spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://localhost:3307/chapchap_subscription_test?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul}
    username: ${TEST_DB_USERNAME:${DB_USERNAME}}
    password: ${TEST_DB_PASSWORD:${DB_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: true

  sql:
    init:
      data-locations: classpath:dummy/data.sql
      encoding: UTF-8
      mode: always

  kafka:
    listener:
      auto-startup: false

